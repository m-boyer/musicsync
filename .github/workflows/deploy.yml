name: Deploy to Coolify

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against production
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      target_sha:
        description: Full 40-character commit SHA required for rollback
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: musicsync-prod
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish production image
    uses: ./.github/workflows/ghcr-coolify-deploy.yml
    with:
      environment: prod
      operation: ${{ inputs.operation }}
      target_sha: ${{ inputs.target_sha }}
      node_version: "22"
      node_cache: npm
      install_command: npm ci
      test_command: npm run typecheck && npm run test:coverage
      build_command: npm run build

  deploy:
    name: Deploy and verify health
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/actions

      - name: Trigger Coolify and verify health
        uses: ./.github/actions/coolify-deploy
        with:
          token: ${{ secrets.COOLIFY_TOKEN }}
          webhook: ${{ secrets.COOLIFY_WEBHOOK }}
          enabled: ${{ vars.COOLIFY_DEPLOY_ENABLED }}
          health_url: ${{ vars.APP_HEALTH_URL }}
          health_mode: revision-json
          expected_revision: ${{ needs.publish.outputs.revision }}
